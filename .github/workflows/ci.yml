name: GitOps CI - Build & Push to ECR

on:
  push:
    branches: ["gitops"]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build & push app image
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          docker build -t "$ECR_REGISTRY/${{ secrets.ECR_REPO_APP }}:${IMAGE_TAG}" ./app
          docker push "$ECR_REGISTRY/${{ secrets.ECR_REPO_APP }}:${IMAGE_TAG}"

      - name: Update Helm values with new image tag
        run: |
          sed -i "s/^\\s*tag: .*/  tag: ${IMAGE_TAG}/" helm/values.yaml || true

      - name: Commit Helm value updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml || true
          git commit -m "chore: update helm image tag to ${IMAGE_TAG}" || echo "No changes to commit"
          git push
