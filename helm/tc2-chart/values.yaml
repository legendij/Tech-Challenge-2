replicaCount: 1

image:
  repository: 391061376449.dkr.ecr.us-east-1.amazonaws.com/tc2-app
  tag: latest

service:
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: alb
  scheme: internet-facing

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50
