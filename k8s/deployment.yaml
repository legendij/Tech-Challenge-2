apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc2-app
  labels:
    app: tc2-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tc2-app
  template:
    metadata:
      labels:
        app: tc2-app
    spec:
      containers:
        - name: tc2-app
          image: 391061376449.dkr.ecr.us-east-1.amazonaws.com/tech-challenge-2/app:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
